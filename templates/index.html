<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV to XLSX + PDF (3 per A4)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h4 mb-3">CSV to XLSX + PDF Labels</h1>
            <p class="mb-4">Upload a CSV like <span class="fw-semibold">orders-2025-11-16.csv</span>. The app returns a ZIP with an <span class="fw-semibold">output.xlsx</span> (wrapped long cells) and <span class="fw-semibold">labels.pdf</span> (3 addresses per A4). The PDF uses columns A, G, F for the "To" block.</p>
            <form method="post" action="/process" enctype="multipart/form-data" class="d-flex gap-2 align-items-center">
              <input class="form-control" type="file" name="file" accept=".csv" required>
              <button class="btn btn-primary" type="submit">Convert</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
